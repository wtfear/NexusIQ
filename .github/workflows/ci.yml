name: NexusIQ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    name: Validate Docker Compose Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dev Compose Config
        run: |
          docker compose -f deployment/docker_compose/docker-compose.dev.yml config --quiet
          echo "✅ Dev Docker Compose configuration is valid."

      - name: Validate Production Compose Config
        run: |
          docker compose -f deployment/docker_compose/docker-compose.prod.yml config --quiet
          echo "✅ Production Docker Compose configuration is valid."

  validate-backend:
    name: Backend Lint & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install UV and Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          echo "✅ Python & UV environment initialized."

      - name: Verify Backend Configuration
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          echo "✅ pyproject.toml syntax and schema validated."

  validate-frontend:
    name: Frontend Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Verify Web Package Config
        run: |
          node -e "const pkg = require('./package.json'); console.log('Checking ' + pkg.name);"
          echo "✅ Frontend package structure validated."

  build-status:
    name: NexusIQ Build Status
    needs: [validate-docker, validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report Status
        run: |
          if [ "${{ needs.validate-docker.result }}" != "success" ] || \
             [ "${{ needs.validate-backend.result }}" != "success" ] || \
             [ "${{ needs.validate-frontend.result }}" != "success" ]; then
            echo "❌ CI validation failed on one or more jobs."
            exit 1
          fi
          echo "🚀 All NexusIQ CI/CD checks passed successfully!"
