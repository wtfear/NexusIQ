<svg width="240" height="42" viewBox="0 0 240 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="siriusGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="siriusCore" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="siriusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sirius Radiant Diamond Star (Alpha Canis Majoris) -->
  <g transform="translate(3, 3)">
    <!-- 8-Point Diamond Star -->
    <path d="M18 0L21.5 11L32 7L24 16L36 18L24 20L32 29L21.5 25L18 36L14.5 25L4 29L12 20L0 18L12 16L4 7L14.5 11Z" fill="url(#siriusGrad)" />
    <!-- Center Radiant Core -->
    <circle cx="18" cy="18" r="5" fill="url(#siriusCore)" filter="url(#siriusGlow)" />
    <circle cx="18" cy="18" r="2.5" fill="#0284C7" />
  </g>

  <!-- Typography -->
  <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="#0F172A">SIRIUS</text>
  <rect x="142" y="11" width="40" height="20" rx="4" fill="#0284C7" />
  <text x="151" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">IQ</text>
</svg>
